name: Apply production Prisma migrations

on:
  workflow_dispatch:
    inputs:
      backup_path:
        description: Absolute path to the verified Contabo backup archive
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-prisma-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on:
      - self-hosted
      - linux
      - whatsquery-vps
    timeout-minutes: 20
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      BACKUP_PATH: ${{ inputs.backup_path }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Validate Prisma migration files
        run: npm run migration:encoding-check

      - name: Verify backup archive checksum
        shell: bash
        run: |
          set -euo pipefail
          test -s "${BACKUP_PATH}"
          test -f "${BACKUP_PATH}.sha256"
          cd "$(dirname "${BACKUP_PATH}")"
          sha256sum --check "$(basename "${BACKUP_PATH}").sha256"

      - name: Audit migration SQL
        run: npm run migration:audit

      - name: Validate and generate
        run: |
          npx prisma validate
          npx prisma generate

      - name: Show pre-deployment status
        continue-on-error: true
        run: npx prisma migrate status

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Verify migration status and live schema
        run: |
          npx prisma migrate status
          node scripts/verify-live-database.mjs
