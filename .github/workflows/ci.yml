name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
      NEXTAUTH_SECRET: ci-only-placeholder-secret
      AUTH_SECRET: ci-only-placeholder-secret
      INTEGRATION_CREDENTIAL_SECRET: ci-only-placeholder-credential-secret

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit --incremental false

      - name: Onboarding tests
        run: npm run test:onboarding

      - name: Integration tests
        run: npm run test:integrations

      - name: Telecom tests
        run: npm run test:telecom

      - name: Security tests
        run: npm run test:security

      - name: Production build
        run: npm run build
